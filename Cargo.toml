[package]
name = "s2-smart-relay"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "s2-smart-relay"
harness = false

[profile.release]
opt-level = "s"

[dependencies]
anyhow = "1.0.75"
log = "0.4"
serde = "1"
serde_json = "1"
esp-idf-svc = { version = "0.49", features = ["alloc"] }
ws2812-esp32-rmt-driver = {path="../ws2812-esp32-rmt-driver"}
crossbeam = "0.8.4"

[build-dependencies]
embuild = "0.32"
